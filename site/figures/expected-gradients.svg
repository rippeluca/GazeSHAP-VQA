<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" role="img" aria-labelledby="egTitle egDesc">
  <title id="egTitle">Expected gradients</title>
  <desc id="egDesc">A black baseline is interpolated toward the image. The gradient of the answer logit with respect to the patches is averaged over several interpolations and turned into a distribution.</desc>
  <rect width="920" height="200" fill="#f7f4ee"/>
  <g>
    <rect x="24" y="36" width="120" height="88" rx="8" fill="#fffdf9" stroke="#e4ddd2"/>
    <rect x="52" y="58" width="64" height="40" fill="#1c1915"/>
    <text x="84" y="148" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Black baseline</text>
  </g>
  <polygon points="176,80 156,74 156,86" fill="#8c3d2a"/>
  <g>
    <rect x="188" y="36" width="150" height="88" rx="8" fill="#fffdf9" stroke="#e4ddd2"/>
    <text x="263" y="76" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Interpolate</text>
    <text x="263" y="96" text-anchor="middle" font-size="13" font-family="Palatino, Georgia, serif" fill="#5c564c">x(a) = a * image</text>
    <text x="263" y="148" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">One a per image</text>
  </g>
  <polygon points="370,80 350,74 350,86" fill="#8c3d2a"/>
  <g>
    <rect x="382" y="36" width="170" height="88" rx="8" fill="#fffdf9" stroke="#e4ddd2"/>
    <text x="467" y="72" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Gradient of the</text>
    <text x="467" y="92" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">answer-token logit</text>
    <text x="467" y="148" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">With the graph kept</text>
  </g>
  <polygon points="584,80 564,74 564,86" fill="#8c3d2a"/>
  <g>
    <rect x="596" y="36" width="140" height="88" rx="8" fill="#fffdf9" stroke="#e4ddd2"/>
    <text x="666" y="76" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Average over</text>
    <text x="666" y="96" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">the baselines</text>
    <text x="666" y="148" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Five in the method</text>
  </g>
  <polygon points="768,80 748,74 748,86" fill="#8c3d2a"/>
  <g>
    <rect x="780" y="36" width="116" height="88" rx="8" fill="#fffdf9" stroke="#e4ddd2"/>
    <text x="838" y="76" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Softmax</text>
    <text x="838" y="96" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">over 16 by 16</text>
    <text x="838" y="148" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">A distribution</text>
  </g>
</svg>
