<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" role="img" aria-labelledby="gridTitle gridDesc">
  <title id="gridTitle">From pixels to the training grid</title>
  <desc id="gridDesc">A 16 pixel patch is merged two by two into a 32 by 32 visual token. Those tokens are pooled down to the 16 by 16 grid used for the loss.</desc>
  <rect width="920" height="220" fill="#f7f4ee"/>
  <g transform="translate(48,36)">
    <rect x="0" y="0" width="112" height="112" fill="#fffdf9" stroke="#e4ddd2"/>
    <path d="M28 0 V112 M56 0 V112 M84 0 V112 M0 28 H112 M0 56 H112 M0 84 H112" stroke="#e4ddd2" fill="none"/>
    <rect x="0" y="0" width="56" height="56" fill="none" stroke="#8c3d2a" stroke-width="2"/>
    <text x="56" y="140" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">16 px patches</text>
    <text x="56" y="158" text-anchor="middle" font-size="13" font-family="Palatino, Georgia, serif" fill="#5c564c">one cell = 16 by 16 px</text>
  </g>
  <polygon points="216,92 196,86 196,98" fill="#8c3d2a"/>
  <g transform="translate(248,36)">
    <rect x="0" y="0" width="112" height="112" fill="#fffdf9" stroke="#e4ddd2"/>
    <path d="M56 0 V112 M0 56 H112" stroke="#e4ddd2" fill="none"/>
    <rect x="0" y="0" width="56" height="56" fill="#f3e4dc" stroke="#8c3d2a" stroke-width="2"/>
    <text x="28" y="32" text-anchor="middle" font-size="12" font-family="Palatino, Georgia, serif" fill="#1c1915">token</text>
    <text x="56" y="140" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Merge 2 by 2</text>
    <text x="56" y="158" text-anchor="middle" font-size="13" font-family="Palatino, Georgia, serif" fill="#5c564c">one token = 32 by 32 px</text>
  </g>
  <polygon points="416,92 396,86 396,98" fill="#8c3d2a"/>
  <g transform="translate(448,48)">
    <rect x="0" y="8" width="150" height="72" rx="8" fill="#fffdf9" stroke="#e4ddd2"/>
    <text x="75" y="38" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Flat patch tensor</text>
    <text x="75" y="58" text-anchor="middle" font-size="13" font-family="Palatino, Georgia, serif" fill="#5c564c">merge order, not a grid</text>
    <text x="75" y="128" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">Unflatten</text>
  </g>
  <polygon points="650,92 630,86 630,98" fill="#8c3d2a"/>
  <g transform="translate(682,44)">
    <rect x="0" y="0" width="96" height="96" fill="#fffdf9" stroke="#e4ddd2"/>
    <path d="M12 0 V96 M24 0 V96 M36 0 V96 M48 0 V96 M60 0 V96 M72 0 V96 M84 0 V96 M0 12 H96 M0 24 H96 M0 36 H96 M0 48 H96 M0 60 H96 M0 72 H96 M0 84 H96" stroke="#e4ddd2" fill="none"/>
    <rect x="24" y="36" width="18" height="12" fill="#8c3d2a" opacity="0.85"/>
    <rect x="42" y="30" width="12" height="18" fill="#8c3d2a" opacity="0.45"/>
    <text x="48" y="128" text-anchor="middle" font-size="14" font-family="Palatino, Georgia, serif" fill="#1c1915">16 by 16 grid</text>
    <text x="48" y="146" text-anchor="middle" font-size="13" font-family="Palatino, Georgia, serif" fill="#5c564c">loss lives here</text>
  </g>
</svg>
