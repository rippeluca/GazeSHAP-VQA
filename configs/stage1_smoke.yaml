# Tiny CPU configuration used by the smoke test in CI. Not a research setting.
_base_: stage1_shap_gaze.yaml

run_id: stage1_smoke
device: cpu

model:
  name: tiny-random-qwen3vl # built by tests/fixtures, never fetched from the hub
  dtype: float32
  min_visual_tokens: 4
  max_visual_tokens: 16

data:
  patch_grid_size: 4
  map_size: 64

shap:
  n_baselines: 2

training:
  num_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  warmup_steps: 0
  max_train_samples: 2
  max_val_samples: 2
