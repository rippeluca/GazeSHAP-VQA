_base_: base.yaml

run_id: stage1

training:
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 50
  num_epochs: 5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  lambda_kl: 0.1
  alpha_wmse: 1.1
  max_grad_norm: 1.0
  # Attribution is numerically sensitive; run it outside autocast if the map degenerates.
  attribution_fp32: false
  eval_every_epoch: true
  max_train_samples: null
  max_val_samples: null
